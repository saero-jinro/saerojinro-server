bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation project(":saerojinro-common")
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    testFixturesImplementation project(':saerojinro-common')
    testFixturesImplementation 'com.auth0:java-jwt:4.4.0'
}

apply from: "../jacoco.gradle"

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}